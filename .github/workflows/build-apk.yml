name: Build APK

# Gera um APK instalavel sem que ninguem precise de Android Studio na maquina.
# O APK fica em "Artifacts", no fundo da pagina do run.
#
# Corre sozinho a cada push nas branches abaixo. O botao "Run workflow" so
# aparece no separador Actions depois deste ficheiro estar na branch por
# omissao do repositorio (main) -- ate la, usa-se o push.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dcaliqui
      - "integracao/**"
      - "fix/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      # Guarda Gradle, o NDK e os artefactos de build entre execucoes. Sem isto
      # cada build volta a descarregar ~1 GB de NDK e toda a cache do Gradle.
      - name: Cache do Gradle e do NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk/ndk
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar que compila
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      # So corre quando o build falha. Repete a compilacao pelo Gradle com
      # stacktrace, para que a causa real fique visivel no log em vez do
      # generico "Process completed with exit code 1".
      - name: Detalhe do erro (so em caso de falha)
        if: failure()
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tail -80

      - name: Publicar APK (artifact, so para quem tem acesso ao repo)
        uses: actions/upload-artifact@v4
        with:
          name: mapazzz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Publica o APK numa release de tag fixa "piloto". O link resultante e
      # publico, permanente e nao muda entre builds -- partilha-se uma vez e
      # cada novo build substitui o ficheiro no mesmo endereco:
      #   https://github.com/${{ github.repository }}/releases/download/piloto/mapazzz.apk
      - name: Publicar link partilhavel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mapazzz.apk
          gh release create piloto \
            --title "MapaZZZ - build de piloto" \
            --notes "APK para teste de campo, atualizado automaticamente a cada build da main. Assinado com chave de debug: instalavel diretamente, nao serve para a Play Store." \
            || echo "release ja existe, apenas a substituir o ficheiro"
          gh release upload piloto mapazzz.apk --clobber
