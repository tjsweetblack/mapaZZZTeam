name: Build APK

# Gera um APK instalavel sem que ninguem precise de Android Studio na maquina.
# O APK fica em "Artifacts", no fundo da pagina do run.
#
# Corre sozinho a cada push nas branches abaixo. O botao "Run workflow" so
# aparece no separador Actions depois deste ficheiro estar na branch por
# omissao do repositorio (main) -- ate la, usa-se o push.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dcaliqui
      - "integracao/**"
      - "fix/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar que compila
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mapazzz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
