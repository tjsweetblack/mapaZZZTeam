name: Build APK

# Gera um APK instalavel sem que ninguem precise de Android Studio na maquina.
# Correr manualmente em: Actions > Build APK > Run workflow
# O APK fica em "Artifacts", no fundo da pagina do run.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar que compila
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mapazzz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
